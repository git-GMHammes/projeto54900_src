<text x="40" y="78" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="24" fill="#0f172a" font-weight="bold">Modulo Map - mapa, pontos, trajetos e CEP</text>
<text x="40" y="108" font-family="Consolas,monospace" font-size="13" fill="#334155">Do SPA React + react-leaflet ate o banco codeigniter54900_db, passando pela API CodeIgniter 4 e pelo proxy map-geo. Base:</text>
